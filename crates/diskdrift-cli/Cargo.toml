[package]
name = "diskdrift-cli"
description = "DiskDrift: read-only disk-space investigation (CLI + TUI)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "diskdrift"
path = "src/main.rs"

[dependencies]
diskdrift-app.workspace = true
diskdrift-tui.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
ctrlc = "3"
mimalloc = "0.1"
libc.workspace = true

[dev-dependencies]
diskdrift-core = { workspace = true, features = ["testutil"] }
