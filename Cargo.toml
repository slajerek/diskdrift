[workspace]
resolver = "3"
members = ["crates/*", "benches/diskdrift-bench"]
default-members = ["crates/*"]


[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
diskdrift-core = { path = "crates/diskdrift-core" }
diskdrift-platform = { path = "crates/diskdrift-platform" }
diskdrift-diagnostics = { path = "crates/diskdrift-diagnostics" }
diskdrift-storage = { path = "crates/diskdrift-storage" }
diskdrift-app = { path = "crates/diskdrift-app" }
diskdrift-tui = { path = "crates/diskdrift-tui" }
anyhow = "1"
thiserror = "2"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
plist = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
crossbeam-channel = "0.5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ratatui = "0.29"
crossterm = "0.28"
zstd = "0.13"
crc32fast = "1"
base64 = "0.22"
tempfile = "3"
fastrand = "2"
memchr = "2"
regex-automata = "0.4"
unicode-normalization = "0.1"

[profile.release]
debug = "line-tables-only"
